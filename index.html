<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#678f89">
  <meta name="description" content="Calculadora local, acessível e confiável com modos básico e científico.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Calculadora">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-terra.png">
  <link rel="stylesheet" href="assets/css/app.css">
  <script data-goatcounter="https://calculadora.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  <title>Calculadora · RafaMass</title>
</head>
<body data-mode="basic" data-error="false" data-viewport="regular">
  <a class="skip-link" href="#display-main">Pular para o visor</a>

  <main class="app-shell" id="calculator" aria-labelledby="app-title">
    <header class="app-header">
      <a class="home-link" href="https://rafa.pro.br/" aria-label="Voltar para rafa.pro.br">← Rafa</a>
      <h1 class="app-title" id="app-title">Calculadora</h1>
      <div class="header-actions">
        <button class="header-command" id="mode-toggle" type="button" aria-pressed="false">
          <span aria-hidden="true">ƒx</span><span class="button-label">Científica</span>
        </button>
        <button class="header-command angle-toggle" id="angle-toggle" type="button" aria-pressed="false">DEG</button>
      </div>
    </header>

    <section class="display-panel" aria-label="Visor da calculadora">
      <p class="display-expression" id="display-expression">pronta para calcular</p>
      <output class="display-main" id="display-main" aria-live="polite">0</output>
      <span class="calculator-status" id="calculator-status" role="status" aria-live="polite">Calculadora pronta</span>
    </section>

    <section class="calculator-body" aria-label="Teclado da calculadora">
      <div class="scientific-panel" id="scientific-panel" hidden>
        <button class="key key-function" type="button" data-key="sin" aria-label="Seno">sin</button>
        <button class="key key-function" type="button" data-key="cos" aria-label="Cosseno">cos</button>
        <button class="key key-function" type="button" data-key="tan" aria-label="Tangente">tan</button>
        <button class="key key-function" type="button" data-key="sqrt" aria-label="Raiz quadrada">√</button>
        <button class="key key-function" type="button" data-key="pow2" aria-label="Elevar ao quadrado">x²</button>
        <button class="key key-function" type="button" data-key="log" aria-label="Logaritmo na base dez">log</button>
        <button class="key key-function" type="button" data-key="ln" aria-label="Logaritmo natural">ln</button>
        <button class="key key-function" type="button" data-key="pi" aria-label="Constante pi">π</button>
        <button class="key key-function" type="button" data-key="e" aria-label="Constante de Euler">e</button>
        <button class="key key-function" type="button" data-key="inv" aria-label="Inverso multiplicativo">1/x</button>
      </div>

      <div class="keypad" id="basic-panel">
        <button class="key key-function" type="button" data-key="C" aria-label="Limpar tudo">C</button>
        <button class="key key-function" type="button" data-key="sign" aria-label="Trocar sinal">+/−</button>
        <button class="key key-function" type="button" data-key="%" aria-label="Porcentagem">%</button>
        <button class="key key-operator" type="button" data-key="/" aria-label="Dividir">÷</button>

        <button class="key" type="button" data-key="7">7</button>
        <button class="key" type="button" data-key="8">8</button>
        <button class="key" type="button" data-key="9">9</button>
        <button class="key key-operator" type="button" data-key="*" aria-label="Multiplicar">×</button>

        <button class="key" type="button" data-key="4">4</button>
        <button class="key" type="button" data-key="5">5</button>
        <button class="key" type="button" data-key="6">6</button>
        <button class="key key-operator" type="button" data-key="-" aria-label="Subtrair">−</button>

        <button class="key" type="button" data-key="1">1</button>
        <button class="key" type="button" data-key="2">2</button>
        <button class="key" type="button" data-key="3">3</button>
        <button class="key key-operator" type="button" data-key="+" aria-label="Somar">+</button>

        <button class="key key-zero" type="button" data-key="0">0</button>
        <button class="key" type="button" data-key="." aria-label="Separador decimal">,</button>
        <button class="key key-equals" type="button" data-key="=" aria-label="Calcular resultado">=</button>
      </div>
    </section>
  </main>

  <script src="assets/js/calculator-engine.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
