<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171a1d">
  <meta name="description" content="Calculadora local, acessível e confiável com modos básico e científico.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Calculadora">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-terra.png">
  <link rel="stylesheet" href="assets/css/rafamass-blueprint.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/numeric-refinement.css">
  <script data-goatcounter="https://calculadora.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  <title>Calculadora · RafaMass</title>
</head>
<body data-rm-blueprint data-mode="basic" data-error="false" data-viewport="regular">
  <a class="skip-link" href="#display-main">Pular para o visor</a>

  <div class="stage-shell">
    <div class="technical-rail" aria-hidden="true">
      <span>RF/MSS — UNIDADE DE CÁLCULO</span>
      <span>LOCAL · SEM CONTA · OFFLINE</span>
      <span>ESTADO / PRONTO</span>
    </div>

    <main class="apparatus rm-surface" id="calculator" aria-labelledby="app-title">
      <header class="app-header">
        <a class="home-link rm-command" href="https://rafa.pro.br/" aria-label="Voltar para rafa.pro.br">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.7327 19.7905C11.0326 20.0762 11.5074 20.0646 11.7931 19.7647C12.0788 19.4648 12.0672 18.99 11.7673 18.7043L5.51587 12.7497H20.25C20.6642 12.7497 21 12.4139 21 11.9997C21 11.5855 20.6642 11.2497 20.25 11.2497H5.51577L11.7673 5.29502C12.0672 5.00933 12.0787 4.5346 11.7931 4.23467C11.5074 3.93475 11.0326 3.9232 10.7327 4.20889L3.31379 11.2756C3.14486 11.4365 3.04491 11.6417 3.01393 11.8551C3.00479 11.9019 3 11.9503 3 11.9997C3 12.0493 3.00481 12.0977 3.01398 12.1446C3.04502 12.3579 3.14496 12.563 3.31379 12.7238L10.7327 19.7905Z"/></svg>
          <span>Rafa</span>
        </a>

        <div class="title-block">
          <p class="rm-kicker">CÁLCULO // APARATO LOCAL</p>
          <h1 id="app-title">Resultado direto.</h1>
        </div>

        <div class="header-actions">
          <button class="header-command rm-command" id="mode-toggle" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7C7 5.895 7.895 5 9 5h6c1.105 0 2 .895 2 2v1c0 1.105-.895 2-2 2H9c-1.105 0-2-.895-2-2V7Zm2-.5a.5.5 0 0 0-.5.5v1c0 .276.224.5.5.5h6a.5.5 0 0 0 .5-.5V7a.5.5 0 0 0-.5-.5H9ZM8.25 14.5a1.25 1.25 0 1 0 0-2.5 1.25 1.25 0 0 0 0 2.5Zm0 4a1.25 1.25 0 1 0 0-2.5 1.25 1.25 0 0 0 0 2.5Zm7.5-4a1.25 1.25 0 1 0 0-2.5 1.25 1.25 0 0 0 0 2.5Zm0 4a1.25 1.25 0 1 0 0-2.5 1.25 1.25 0 0 0 0 2.5ZM12 14.5a1.25 1.25 0 1 0 0-2.5 1.25 1.25 0 0 0 0 2.5Zm0 4a1.25 1.25 0 1 0 0-2.5 1.25 1.25 0 0 0 0 2.5ZM7.25 2A3.25 3.25 0 0 0 4 5.25v13.5A3.25 3.25 0 0 0 7.25 22h9.5A3.25 3.25 0 0 0 20 18.75V5.25A3.25 3.25 0 0 0 16.75 2h-9.5ZM5.5 5.25c0-.966.784-1.75 1.75-1.75h9.5c.966 0 1.75.784 1.75 1.75v13.5c0 .966-.784 1.75-1.75 1.75h-9.5a1.75 1.75 0 0 1-1.75-1.75V5.25Z"/></svg>
            <span class="button-label">Científica</span>
          </button>
          <button class="header-command angle-toggle rm-command" id="angle-toggle" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20Zm0 1.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17ZM7.083 8.708c-.406-1.019.605-2.03 1.624-1.624l3.952 1.507a4.75 4.75 0 0 1 2.753 2.753l1.785 4.212c.445 1.037-.604 2.086-1.641 1.641l-4.213-1.783a4.75 4.75 0 0 1-2.753-2.753L7.083 8.708Zm3 3.473a3.25 3.25 0 0 0 1.738 1.784l3.497 1.355-1.354-3.499a3.25 3.25 0 0 0-1.783-1.739L8.692 8.692l1.39 3.489Z"/></svg>
            <span>DEG</span>
          </button>
        </div>
      </header>

      <section class="display-panel rm-meta-strip" aria-label="Visor da calculadora">
        <div class="display-register"><span>ENTRADA / RESULTADO</span><span>15 DÍGITOS</span></div>
        <p class="display-expression" id="display-expression">pronta para calcular</p>
        <output class="display-main rm-type-numeric" id="display-main" aria-live="polite">0</output>
        <span class="calculator-status" id="calculator-status" role="status" aria-live="polite">Calculadora pronta</span>
      </section>

      <section class="calculator-body" aria-label="Teclado da calculadora">
        <div class="scientific-panel" id="scientific-panel" hidden>
          <button class="key key-function rm-key" type="button" data-key="sin">sin</button><button class="key key-function rm-key" type="button" data-key="cos">cos</button><button class="key key-function rm-key" type="button" data-key="tan">tan</button><button class="key key-function rm-key" type="button" data-key="sqrt">√</button><button class="key key-function rm-key" type="button" data-key="pow2">x²</button>
          <button class="key key-function rm-key" type="button" data-key="log">log</button><button class="key key-function rm-key" type="button" data-key="ln">ln</button><button class="key key-function rm-key" type="button" data-key="pi">π</button><button class="key key-function rm-key" type="button" data-key="e">e</button><button class="key key-function rm-key" type="button" data-key="inv">1/x</button>
        </div>

        <div class="keypad" id="basic-panel">
          <button class="key key-function rm-key" type="button" data-key="C">C</button><button class="key key-function rm-key" type="button" data-key="sign">+/−</button><button class="key key-function rm-key" type="button" data-key="%">%</button><button class="key key-operator rm-key" type="button" data-key="/">÷</button>
          <button class="key rm-key rm-type-numeric" type="button" data-key="7">7</button><button class="key rm-key rm-type-numeric" type="button" data-key="8">8</button><button class="key rm-key rm-type-numeric" type="button" data-key="9">9</button><button class="key key-operator rm-key" type="button" data-key="*">×</button>
          <button class="key rm-key rm-type-numeric" type="button" data-key="4">4</button><button class="key rm-key rm-type-numeric" type="button" data-key="5">5</button><button class="key rm-key rm-type-numeric" type="button" data-key="6">6</button><button class="key key-operator rm-key" type="button" data-key="-">−</button>
          <button class="key rm-key rm-type-numeric" type="button" data-key="1">1</button><button class="key rm-key rm-type-numeric" type="button" data-key="2">2</button><button class="key rm-key rm-type-numeric" type="button" data-key="3">3</button><button class="key key-operator rm-key" type="button" data-key="+">+</button>
          <button class="key key-zero rm-key rm-type-numeric" type="button" data-key="0">0</button><button class="key rm-key rm-type-numeric" type="button" data-key=".">,</button><button class="key key-equals rm-key" type="button" data-key="=">=</button>
        </div>
      </section>

      <footer class="apparatus-footer"><span>TECLADO FÍSICO ATIVO</span><span>ESC LIMPA · ENTER CALCULA</span></footer>
    </main>
  </div>

  <script src="assets/js/calculator-engine.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
